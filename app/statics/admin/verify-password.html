<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grok2API — 访问验证</title>
<style>
:root {
  --bg: #0a0a0a;
  --surface: #141414;
  --border: #2a2a2a;
  --text: #e0e0e0;
  --text-secondary: #888;
  --accent: #6366f1;
  --accent-hover: #818cf8;
  --danger: #ef4444;
  --radius: 8px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 2rem;
  width: 100%;
  max-width: 400px;
}
.card h2 {
  font-size: 1.25rem;
  font-weight: 600;
  margin-bottom: 0.5rem;
}
.card p {
  color: var(--text-secondary);
  font-size: 0.875rem;
  margin-bottom: 1.5rem;
}
.form-group { margin-bottom: 1rem; }
.form-group label {
  display: block;
  font-size: 0.8125rem;
  font-weight: 500;
  margin-bottom: 0.375rem;
}
.form-group input {
  width: 100%;
  padding: 0.625rem 0.75rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 0.9375rem;
  outline: none;
  transition: border-color 0.15s;
}
.form-group input:focus { border-color: var(--accent); }
.btn {
  width: 100%;
  padding: 0.625rem;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-size: 0.9375rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
}
.btn:hover { background: var(--accent-hover); }
.error {
  color: var(--danger);
  font-size: 0.8125rem;
  margin-top: 0.75rem;
  text-align: center;
  display: none;
}
.error.visible { display: block; }
</style>
</head>
<body>
<div class="card">
  <h2>访问验证</h2>
  <p>请输入 LD 访问密码以继续</p>
  <form id="verify-form">
    <input type="hidden" id="token" name="token">
    <div class="form-group">
      <label for="password">访问密码</label>
      <input type="password" id="password" name="password" placeholder="请输入访问密码" autofocus required>
    </div>
    <button type="submit" class="btn">验证</button>
    <div class="error" id="error"></div>
  </form>
</div>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var token = params.get('token');
  if (!token) {
    document.querySelector('.card').innerHTML = '<h2>无效请求</h2><p>缺少验证令牌，请重新登录。</p>';
    return;
  }
  document.getElementById('token').value = token;

  document.getElementById('verify-form').addEventListener('submit', function(e) {
    e.preventDefault();
    var errEl = document.getElementById('error');
    errEl.classList.remove('visible');
    var btn = this.querySelector('button');
    btn.disabled = true;
    btn.textContent = '验证中...';

    var fd = new FormData();
    fd.append('token', token);
    fd.append('password', document.getElementById('password').value);

    fetch('/admin/verify-password', { method: 'POST', body: fd })
      .then(function(res) {
        if (res.redirected) {
          window.location.href = res.url;
          return;
        }
        return res.text().then(function(html) {
          if (!res.ok) {
            errEl.textContent = html.replace(/<[^>]*>/g, '') || '验证失败';
            errEl.classList.add('visible');
          }
        });
      })
      .catch(function() {
        errEl.textContent = '网络错误，请重试';
        errEl.classList.add('visible');
      })
      .finally(function() {
        btn.disabled = false;
        btn.textContent = '验证';
      });
  });
})();
</script>
</body>
</html>
