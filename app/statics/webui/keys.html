<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="keys.pageTitle">Grok2API - API Keys</title>
  <link rel="icon" href="/favicon.ico?v={{APP_VERSION}}">
  <link href="https://cdn.jsdelivr.net/npm/geist@1.0.0/dist/fonts/geist-sans/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/geist@1.0.0/dist/fonts/geist-mono/style.css" rel="stylesheet">
  <link href="/static/css/app.css?v={{APP_VERSION}}" rel="stylesheet">
</head>
<body class="webui-page">
  <div id="webui-header" data-active="/webui/keys"></div>

  <main class="webui-main webui-chat-layout">
    <aside class="webui-sidebar keys-sidebar">
      <a href="/webui/chat" class="keys-sidebar-back" data-i18n="keys.backToChat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back to Chat
      </a>
      <div id="userProfile" class="profile-area"></div>
    </aside>

    <section class="webui-workspace">
      <section class="webui-keys-shell">
        <header class="webui-keys-head">
          <h1 class="webui-keys-title" data-i18n="keys.title">API Keys</h1>
          <button id="createKeyBtn" class="btn btn-primary" style="font-size:13px;height:32px" data-i18n="keys.create">Create Key</button>
        </header>

        <div id="keyListContainer">
          <div id="keyListSkeleton" class="keys-list-page">
            <div class="skeleton" style="height:44px"></div>
            <div class="skeleton" style="height:44px"></div>
            <div class="skeleton" style="height:44px"></div>
          </div>
          <div id="keyList" class="keys-list-page" style="display:none"></div>
          <div id="keyListEmpty" class="keys-empty-state" style="display:none">
            <svg class="keys-empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M15 7h3a2 2 0 012 2v10a2 2 0 01-2 2H6a2 2 0 01-2-2V9a2 2 0 012-2h3M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2"/>
              <path d="M12 12v4M12 12l-2 2M12 12l2 2"/>
            </svg>
            <div class="keys-empty-title" data-i18n="keys.emptyTitle">No API Keys</div>
            <div class="keys-empty-desc" data-i18n="keys.emptyDesc">Create your first API key to access the Grok API programmatically.</div>
            <button class="btn btn-primary" onclick="document.getElementById('createKeyBtn').click()" data-i18n="keys.createFirst">Create First Key</button>
          </div>
          <div id="keyListError" class="keys-error" style="display:none">
            <span data-i18n="keys.loadError">Failed to load keys.</span>
            <button class="keys-retry-btn" data-i18n="keys.retry">Retry</button>
          </div>
          <div id="keyListNoAccess" class="keys-empty-state" style="display:none">
            <div class="keys-empty-icon" style="opacity:0.4">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
              </svg>
            </div>
            <div class="keys-empty-title" data-i18n="keys.noAccess">Login with LinuxDo to manage API keys.</div>
          </div>
        </div>
      </section>
    </section>
  </main>

  <div id="keyCreateModal" class="modal-overlay" aria-hidden="true" style="display:none">
    <div class="modal">
      <div id="keyCreateForm">
        <div class="modal-title" data-i18n="keys.createTitle">Create API Key</div>
        <div class="text-xs text-muted mt-2" data-i18n="keys.createDesc">Give your key a name to remember its purpose.</div>
        <input id="keyNameInput" class="input mt-2 w-full" type="text" placeholder="Key name" data-i18n-placeholder="keys.namePlaceholder">
        <div class="modal-footer">
          <button id="keyCreateCancel" type="button" class="btn btn-ghost" data-i18n="webui.chat.cancel">取消</button>
          <button id="keyCreateConfirm" type="button" class="btn btn-primary" data-i18n="webui.chat.confirm">确认</button>
        </div>
      </div>
      <div id="keyCreateResult" style="display:none">
        <div class="modal-title" data-i18n="keys.createdTitle">Key Created</div>
        <div class="text-xs text-muted mt-2" data-i18n="keys.createdWarning">Copy this key now — it will not be shown again.</div>
        <div class="key-raw-display mt-2">
          <code id="rawKeyDisplay" class="key-mono"></code>
          <button id="copyRawKeyBtn" class="btn btn-outline" style="font-size:11px;height:26px" data-i18n="keys.copy">Copy</button>
        </div>
        <div class="modal-footer">
          <button id="keyCreateClose" type="button" class="btn btn-ghost" data-i18n="webui.chat.cancel">关闭</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/i18n.js?v={{APP_VERSION}}"></script>
  <script src="/static/js/auth.js?v={{APP_VERSION}}"></script>
  <script src="/static/js/toast.js?v={{APP_VERSION}}"></script>
  <script src="/static/js/webui-header.js?v={{APP_VERSION}}"></script>
  <script src="/static/js/footer.js?v={{APP_VERSION}}"></script>
  <script src="/static/js/webui/profile.js?v={{APP_VERSION}}"></script>
  <script>
    (function () {
      var API_BASE = '/webui/api/me';
      var keysCache = [];
      var _initialLoad = true;
      var _key = '';

      function t(key, fallback) { return typeof window.t === 'function' ? window.t(key) : fallback; }
      function esc(s) { var el = document.createElement('span'); el.textContent = s; return el.innerHTML; }
      function fmtDate(iso) { if (!iso) return ''; return new Date(iso).toLocaleDateString(); }
      function toast(msg, type) { if (typeof showToast === 'function') showToast(msg, type); }

      var $ = function (id) { return document.getElementById(id); };

      function showView(id) {
        ['keyListSkeleton', 'keyList', 'keyListEmpty', 'keyListError', 'keyListNoAccess'].forEach(function (vid) {
          var el = $(vid);
          if (el) el.style.display = vid === id ? '' : 'none';
        });
      }

      function loadKey() {
        try {
          return webuiKey.get().then(function (k) { _key = k || ''; });
        } catch (e) { _key = ''; return Promise.resolve(); }
      }

      function authHeaders() {
        return _key ? { Authorization: 'Bearer ' + _key } : {};
      }

      function fetchKeys() {
        showView('keyListSkeleton');
        fetch(API_BASE + '/keys', { headers: authHeaders() })
          .then(function (resp) {
            if (resp.status === 401) { showView('keyListNoAccess'); return Promise.reject('no access'); }
            if (!resp.ok) throw new Error(resp.status);
            return resp.json();
          })
          .then(function (data) {
            keysCache = Array.isArray(data) ? data : [];
            if (_initialLoad) {
              _initialLoad = false;
              var container = $('userProfile');
              if (container && window.WebuiProfile) WebuiProfile.renderSidebar(container);
            }
            if (keysCache.length === 0) {
              showView('keyListEmpty');
              var createBtn = $('createKeyBtn');
              if (createBtn && $('keyListEmpty').style.display !== 'none') createBtn.style.display = 'none';
            } else {
              var cb = $('createKeyBtn');
              if (cb) cb.style.display = '';
              renderKeyList();
              showView('keyList');
            }
          })
          .catch(function (e) {
            if (e === 'no access') return;
            showView('keyListError');
          });
      }

      function createKey(name) {
        return fetch(API_BASE + '/keys', {
          method: 'POST',
          headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
          body: JSON.stringify({ key_name: name || 'Default' }),
        }).then(function (resp) {
          if (!resp.ok) {
            return resp.json().catch(function () { return {}; }).then(function (err) {
              throw new Error(err.detail || 'Failed to create key');
            });
          }
          return resp.json();
        });
      }

      function deleteKey(id) {
        return fetch(API_BASE + '/keys/' + id, {
          method: 'DELETE',
          headers: authHeaders(),
        }).then(function (resp) {
          if (!resp.ok) throw new Error('Failed to delete key');
        });
      }

      function renderKeyList() {
        var container = $('keyList');
        if (!container) return;
        container.innerHTML = keysCache.map(function (k) {
          return '<div class="key-row" data-id="' + k.id + '">' +
            '<div class="key-info">' +
              '<span class="key-mono">' + esc(k.key_prefix) + '…</span>' +
              '<span class="key-name">' + esc(k.key_name) + '</span>' +
            '</div>' +
            '<div class="key-meta">' +
              '<span class="key-date">' + fmtDate(k.created_at) + '</span>' +
              (k.is_banned ? '<span class="key-badge key-badge-banned">' + t('keys.banned', 'Banned') + '</span>' : '') +
            '</div>' +
            '<button class="key-delete" data-id="' + k.id + '" title="' + t('keys.delete', 'Delete') + '">' +
              '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14"/></svg>' +
            '</button>' +
          '</div>';
        }).join('');
        container.querySelectorAll('.key-delete').forEach(function (btn) {
          btn.addEventListener('click', function () { handleDelete(btn.dataset.id); });
        });
      }

      function handleDelete(id) {
        if (!confirm(t('keys.confirmDelete', 'Delete this API key? It will stop working immediately.'))) return;
        deleteKey(id).then(function () {
          toast(t('keys.deleted', 'Key deleted.'), 'success');
          fetchKeys();
        }).catch(function () {
          toast(t('keys.deleteError', 'Failed to delete key.'), 'error');
        });
      }

      function showModal() {
        $('keyNameInput').value = '';
        $('keyCreateForm').style.display = '';
        $('keyCreateResult').style.display = 'none';
        $('keyCreateModal').style.display = 'flex';
      }

      function hideModal() {
        $('keyCreateModal').style.display = 'none';
      }

      function handleCreate() {
        var input = $('keyNameInput');
        var name = (input ? input.value.trim() : '') || 'Default';
        createKey(name).then(function (result) {
          $('keyCreateForm').style.display = 'none';
          $('keyCreateResult').style.display = '';
          $('rawKeyDisplay').textContent = result.raw_key;
          $('copyRawKeyBtn').onclick = function () {
            navigator.clipboard.writeText(result.raw_key).then(function () {
              toast(t('keys.copied', 'Key copied!'), 'success');
            });
          };
          return fetchKeys();
        }).catch(function (e) { toast(e.message, 'error'); });
      }

      function init() {
        $('createKeyBtn').addEventListener('click', showModal);
        $('keyCreateCancel').addEventListener('click', hideModal);
        $('keyCreateConfirm').addEventListener('click', handleCreate);
        $('keyCreateClose').addEventListener('click', hideModal);
        $('keyCreateModal').addEventListener('click', function (e) {
          if (e.target === e.currentTarget) hideModal();
        });
        var retryBtn = document.querySelector('.keys-retry-btn');
        if (retryBtn) retryBtn.addEventListener('click', fetchKeys);

        $('keyListContainer').addEventListener('click', function (e) {
          var btn = e.target.closest('.key-delete');
          if (btn && btn.dataset.id) handleDelete(btn.dataset.id);
        });

        loadKey().then(fetchKeys);
      }

      document.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
</html>
